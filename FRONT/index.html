<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Maestri Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/6885f0bfb3.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</head>
<body>
    <main class="formulario">
    <form id="form-login">
        <h1> Login Di Maestri </h1>
        <div class="bonequinho-do-input">
            <input placeholder="Usuário" type="text" required>
            
        </div>
        <div class="bonequinho-do-input">
            <input placeholder="Senha" type="password" required>
            
        </div>
        <div class="lembrar-e-esqueci">
            <label>
                <input type="checkbox">
                Lembrar-me
            </label>
        </div>
        <button type="submit" class="login">Login</button>

        <div class="cadastro">
            <p>Não tem uma conta? <a href="cadastro.html" id="ir-cadastro">Cadastre-se</a></p>
        </div>
    </form>
</main>
</body>
</html>
